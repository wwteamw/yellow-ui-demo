<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F7F8" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yellow UI" />
  <title>Yellow UI — Демо</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <style>
    :root {
      --bg: #F6F7F8;
      --surface: #FFFFFF;
      --surface-2: #F0F2F5;
      --text: #111111;
      --text-sec: #79818C;
      --border: rgba(0, 0, 0, 0.06);
      --yellow: #FFDD2D;
      --yellow-press: #FCC521;
      --blue: #2481CC;
      --green: #16A34A;
      --red: #EF4444;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --nav-bg: rgba(255, 255, 255, 0.92);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body.dark {
      --bg: #0F1012;
      --surface: #1C1E22;
      --surface-2: #272A30;
      --text: #F5F6F8;
      --text-sec: #8E95A2;
      --border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      --nav-bg: rgba(24, 26, 30, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: text;
      font-family: inherit;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #E4E7EC;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body.dark {
      background: #050506;
    }

    /* App Shell */
    .app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.12);
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* Scrollable Main Area */
    .views-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 92px);
      opacity: 0;
      transform: translateY(10px) scale(0.992);
      pointer-events: none;
      transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1), transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      scrollbar-width: none;
    }
    .view::-webkit-scrollbar { display: none; }

    .view.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Reusable UI Elements */
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      margin-bottom: 12px;
      transition: transform 0.14s ease, background 0.25s ease;
    }
    .tap:active {
      transform: scale(0.975);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 8px 0 12px;
    }

    .muted {
      color: var(--text-sec);
      font-size: 13px;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }
    .profile-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFDD2D, #FFA800);
      color: #111;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 221, 45, 0.4);
    }
    .profile-name {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.12s ease, background 0.2s ease;
    }
    .icon-btn:active { transform: scale(0.92); }

    /* Search */
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 15px;
      color: var(--text);
    }
    .search-box input::placeholder { color: var(--text-sec); }

    /* Stories */
    .stories-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-item {
      flex: 0 0 92px;
      height: 108px;
      border-radius: 20px;
      padding: 3px;
      background: linear-gradient(135deg, #FFDD2D 0%, #FF6B00 100%);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .story-item.viewed {
      background: var(--surface-2);
    }
    .story-item:active { transform: scale(0.95); }
    .story-inner {
      width: 100%;
      height: 100%;
      border-radius: 17px;
      padding: 10px 9px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.2;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--bg);
    }
    .story-emoji { font-size: 22px; }

    /* Widgets Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .mini-card {
      background: var(--surface);
      border-radius: 22px;
      padding: 14px;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: transform 0.14s ease;
    }
    .mini-card:active { transform: scale(0.97); }
    .spend-bar {
      display: flex;
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      gap: 2px;
      margin-top: 12px;
      background: var(--surface-2);
    }

    /* Quick Actions */
    .actions-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .action-btn {
      background: var(--surface);
      border: none;
      border-radius: 20px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--card-shadow);
      transition: transform 0.14s ease;
    }
    .action-btn:active { transform: scale(0.94); }
    .action-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--yellow);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bank Account Card */
    .account-row {
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
    }
    .acc-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
    }
    .card-chip-mini {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: #1C1E22;
      color: #fff;
    }
    body.dark .card-chip-mini {
      background: #2D3139;
    }
    .frozen-badge {
      background: rgba(36, 129, 204, 0.15);
      color: #2481CC;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      margin-left: 6px;
    }

    /* Transactions List */
    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-item:active { opacity: 0.65; }
    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .tx-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .tx-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-right {
      text-align: right;
      flex-shrink: 0;
    }
    .tx-amount {
      font-size: 15px;
      font-weight: 700;
    }
    .tx-amount.in { color: var(--green); }
    .cashback-pill {
      display: inline-block;
      background: var(--yellow);
      color: #111;
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      margin-top: 2px;
    }

    /* Buttons & Inputs */
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 18px;
      background: var(--yellow);
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: var(--yellow-press);
    }
    .btn-secondary {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .btn-secondary:active { transform: scale(0.98); }

    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      border: 1.5px solid transparent;
      background: var(--surface-2);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.18s ease;
    }
    .field input:focus {
      border-color: var(--yellow);
    }

    .chips-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chips-scroll::-webkit-scrollbar { display: none; }
    .chip {
      border: none;
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .chip.active {
      background: var(--yellow);
      color: #111;
    }
    .chip:active { transform: scale(0.95); }

    /* Bottom Navigation */
    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 6px calc(var(--safe-bottom) + 8px);
      z-index: 30;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: var(--text-sec);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.18s ease, transform 0.15s ease;
    }
    .nav-btn.active {
      color: var(--blue);
    }
    body.dark .nav-btn.active {
      color: var(--yellow);
    }
    .nav-btn:active {
      transform: scale(0.9);
    }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-panel {
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      max-height: 88dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }
    .sheet-backdrop.open .sheet-panel {
      transform: translateY(0);
    }
    .sheet-handle-wrap {
      padding: 10px 0 6px;
      display: flex;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }
    .sheet-handle {
      width: 40px;
      height: 5px;
      border-radius: 99px;
      background: rgba(125, 132, 145, 0.35);
    }
    .sheet-header {
      padding: 4px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sheet-title {
      font-size: 19px;
      font-weight: 700;
    }
    .sheet-body {
      padding: 0 20px 8px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Fullscreen Story Modal */
    .story-overlay {
      position: absolute;
      inset: 0;
      background: #111;
      z-index: 90;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 24px);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .story-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .story-bars {
      display: flex;
      gap: 5px;
      margin-bottom: 14px;
    }
    .story-bar {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.28);
      border-radius: 99px;
      overflow: hidden;
    }
    .story-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    /* Push Notification Banner */
    .push-banner {
      position: absolute;
      top: calc(var(--safe-top) + 10px);
      left: 12px;
      right: 12px;
      background: rgba(25, 27, 31, 0.96);
      color: #fff;
      border-radius: 20px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.32);
      z-index: 100;
      transform: translateY(-150%);
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }
    .push-banner.show {
      transform: translateY(0);
    }

    /* Chat */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 115px);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .chat-messages::-webkit-scrollbar { display: none; }
    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.38;
    }
    .bubble.bot {
      align-self: flex-start;
      background: var(--surface);
      border-bottom-left-radius: 5px;
      box-shadow: var(--card-shadow);
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--yellow);
      color: #111;
      font-weight: 500;
      border-bottom-right-radius: 5px;
    }
    .chat-input-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding-top: 8px;
    }
    .chat-input-bar input {
      flex: 1;
      border: none;
      background: var(--surface);
      color: var(--text);
      padding: 12px 15px;
      border-radius: 99px;
      font-size: 15px;
      outline: none;
      box-shadow: var(--card-shadow);
    }

    /* Plastic Card Visual */
    .plastic-card {
      border-radius: 22px;
      padding: 20px;
      background: linear-gradient(135deg, #1F2229 0%, #0D0E11 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.22);
      transition: filter 0.25s ease;
    }
    .plastic-card.frozen {
      filter: saturate(0.2) brightness(1.1);
      background: linear-gradient(135deg, #3A4B5C 0%, #1F2933 100%);
    }

    /* QR Scanner Laser */
    .qr-box {
      width: 210px;
      height: 210px;
      margin: 12px auto 18px;
      border-radius: 26px;
      background: #14161A;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.65);
      font-size: 13px;
      text-align: center;
      padding: 16px;
    }
    .qr-laser {
      position: absolute;
      left: 10px;
      right: 10px;
      height: 2.5px;
      background: var(--yellow);
      box-shadow: 0 0 12px var(--yellow);
      animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan {
      0%, 100% { top: 18px; }
      50% { top: 185px; }
    }

    /* Switch Toggle */
    .switch {
      width: 48px;
      height: 28px;
      border-radius: 99px;
      background: var(--surface-2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
      border: none;
    }
    .switch.on { background: var(--yellow); }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    .switch.on::after { transform: translateX(20px); background: #111; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Push Banner -->
    <div id="push-banner" class="push-banner" onclick="hidePush()">
      <div class="avatar" style="width:36px;height:36px;font-size:17px;">💛</div>
      <div style="flex:1;min-width:0;">
        <div id="push-title" style="font-weight:700;font-size:14px;">Пополнение счёта</div>
        <div id="push-text" style="font-size:12.5px;color:#CBD2DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">+5 000 ₽ · Black</div>
      </div>
      <div style="font-size:11px;color:#8E95A2;">сейчас</div>
    </div>

    <!-- Views -->
    <div class="views-container">
      <section id="view-home" class="view active"></section>
      <section id="view-pay" class="view"></section>
      <section id="view-city" class="view"></section>
      <section id="view-chat" class="view"></section>
      <section id="view-more" class="view"></section>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
        <span>Главная</span>
      </button>
      <button class="nav-btn" data-tab="pay" onclick="switchTab('pay')">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        <span>Платежи</span>
      </button>
      <button class="nav-btn" data-tab="city" onclick="switchTab('city')">

    let state = loadState();
    let currentTab = 'home';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        return Object.assign(getDefaultState(), JSON.parse(raw));
      } catch (e) {
        return getDefaultState();
      }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}

    function fmtMoney(val, forceVisible = false) {
      if (state.hideBalance && !forceVisible) return '••••• ₽';
      const parts = Number(val).toFixed(2).split('.');
      const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return parts[1] === '00' ? `${intPart} ₽` : `${intPart},${parts[1]} ₽`;
    }

    function getMonthlySpend() {
      return state.transactions
        .filter(t => t.type === 'out' && t.cat !== 'Сбережения')
        .reduce((sum, t) => sum + Number(t.amount), 0);
    }

    function applyTheme() {
      document.body.classList.toggle('dark', !!state.darkMode);
      const meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', state.darkMode ? '#0F1012' : '#F6F7F8');
    }

    // --- Tab Navigation ---
    function switchTab(tab) {
      if (currentTab !== tab) haptic('light');
      currentTab = tab;
      document.querySelectorAll('.view').forEach(el => {
        el.classList.toggle('active', el.id === `view-${tab}`);
      });
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      renderAll();
    }

    let pushTimer = null;
    function showPush(title, text) {
      haptic('success');
      document.getElementById('push-title').textContent = title;
      document.getElementById('push-text').textContent = text;
      const banner = document.getElementById('push-banner');
      banner.classList.add('show');
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => banner.classList.remove('show'), 4000);
    }
    function hidePush() {
      document.getElementById('push-banner').classList.remove('show');
    }

    function renderAll() {
      applyTheme();
      renderHome();
      renderPay();
      renderCity();
      renderChat();
      renderMore();
    }

      const spend = getMonthlySpend();
      const q = (state.searchQuery || '').trim().toLowerCase();
      const filteredTx = q
        ? state.transactions.filter(t => t.title.toLowerCase().includes(q) || t.subtitle.toLowerCase().includes(q))

    // Swipe down gesture on sheet handle
    (() => {
      let startY = 0, currentY = 0, dragging = false;
      const handle = document.getElementById('sheet-handle');
      const panel = document.getElementById('sheet-panel');
      handle.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
        dragging = true;
        panel.style.transition = 'none';
      }, { passive: true });
      window.addEventListener('touchmove', e => {
        if (!dragging) return;
        currentY = Math.max(0, e.touches[0].clientY - startY);
        panel.style.transform = `translateY(${currentY}px)`;
      }, { passive: true });
      window.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        panel.style.transition = '';
        if (currentY > 95) {
          closeSheet();
        } else {
          panel.style.transform = '';
        }
        currentY = 0;
      });
    })();

        amount: amt,
        type: 'out',
        cat: 'Платежи',
        cashback: cb,
        time: 'Только что',
        icon,
        bg: '#F3E8FF'
      });
      saveState();
      closeSheet();
      renderAll();
      showPush('Услуга оплачена', `−${fmtMoney(amt, true)} · Кэшбэк +${cb} ₽`);
    }

    function openCityOrder(idx) {
      const item = CITY_ITEMS[idx];
      const cb = Math.round(item.price * item.cbRate);
      openSheet(item.title, `
        <div class="muted" style="margin-bottom:14px;">${item.desc}</div>
        <div class="card" style="background:var(--surface-2);box-shadow:none;">
          <div class="row" style="margin-bottom:8px;"><span>К оплате</span><b>${fmtMoney(item.price, true)}</b></div>
          <div class="row"><span>Повышенный кэшбэк</span><span class="cashback-pill">+${cb} ₽</span></div>
        </div>
        <button class="btn-primary" onclick="confirmCityOrder(${idx})">Оплатить ${fmtMoney(item.price, true)}</button>
      `);
    }

    function confirmCityOrder(idx) {
      const item = CITY_ITEMS[idx];
      if (state.blackBalance < item.price) {
        showPush('Недостаточно средств', 'Пополните карту Black для оплаты заказа');
        return;
      }
      const cb = Math.round(item.price * item.cbRate);
      state.blackBalance = +(state.blackBalance - item.price).toFixed(2);
      state.cashback += cb;
      state.transactions.unshift({
        id: 'tx_' + Date.now(),
        title: `Город · ${item.title}`,
        subtitle: item.cat,
        amount: item.price,
        type: 'out',
        cat: item.cat,
        cashback: cb,
        time: 'Только что',
        icon: item.icon,
        bg: item.color
      });
      saveState();
      closeSheet();
      renderAll();
      showPush('Заказ оформлен!', `Начислен повышенный кэшбэк +${cb} ₽`);
    }

    // --- Support Chat ---
    function onChatSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('chat-input');
      const txt = (inp.value || '').trim();
      if (!txt) return;
      inp.value = '';
      sendChatMessage(txt);
    }

    function sendChatMessage(txt) {
      haptic('light');
      state.chat.push({ from: 'user', text: txt });
      saveState();
      renderChat();

      setTimeout(() => {
        const low = txt.toLowerCase();
        let reply = 'Проверил информацию по вашему профилю: все счета активны, комиссия за переводы СБП — 0 ₽.';
        if (low.includes('кэшбэк')) {
          reply = `Сейчас у вас накоплено ${state.cashback} ₽ кэшбэка. Выбраны категории: ${state.selectedCats.join(', ')}.`;
        } else if (low.includes('справк') || low.includes('остат')) {
          reply = `Справка сформирована: доступный остаток на карте Black — ${fmtMoney(state.blackBalance, true)}, на накопительном счёте — ${fmtMoney(state.savingsBalance, true)}.`;
        } else if (low.includes('лимит')) {
          reply = 'По СБП доступно до 30 000 000 ₽ в месяц между своими счетами и до 100 000 ₽ без комиссии другим людям.';
        }
        state.chat.push({ from: 'bot', text: reply });
        saveState();
        if (currentTab === 'chat') renderChat();
        haptic('light');
      }, 550);
    }

    // --- Demo Director Sheet ---
    function openDirectorSheet() {
      openSheet('🎬 Режиссёр демо', `
        <div class="muted" style="margin-bottom:12px;">Настройте любые цифры для демонстрации или запустите входящий перевод с пуш-уведомлением.</div>
        <div class="field">
          <label>Имя профиля в шапке</label>
          <input id="dir-name" type="text" value="${escapeHtml(state.userName)}" />
        </div>
        <div class="grid-2" style="margin-bottom:0;">
          <div class="field">
            <label>Баланс Black, ₽</label>
            <input id="dir-blk" type="number" step="0.01" value="${state.blackBalance}" />
          </div>
          <div class="field">
            <label>Накопительный, ₽</label>
            <input id="dir-sav" type="number" step="0.01" value="${state.savingsBalance}" />
          </div>
        </div>
        <button class="btn-primary" style="margin-bottom:14px;" onclick="saveDirector()">Сохранить параметры</button>

        <div style="border-top:1px solid var(--border);padding-top:12px;">
          <div style="font-weight:700;font-size:15px;margin-bottom:8px;">Имитация входящего перевода</div>
          <div class="grid-2" style="margin-bottom:0;">
            <div class="field">
              <label>Отправитель</label>
              <input id="dir-sender" type="text" value="Александр М." />
            </div>
            <div class="field">
              <label>Сумма, ₽</label>
              <input id="dir-inc-amt" type="number" value="25000" />
            </div>
          </div>
          <button class="btn-secondary" onclick="runDirectorPush()">🔔 Прислать Push через 3.5 секунды</button>
        </div>
      `);
    }

    function saveDirector() {
      state.userName = (document.getElementById('dir-name').value || 'Алексей').trim();
      state.blackBalance = parseFloat(document.getElementById('dir-blk').value) || 0;
      state.savingsBalance = parseFloat(document.getElementById('dir-sav').value) || 0;
      saveState();
      closeSheet();
      renderAll();
      showPush('Параметры обновлены', 'Новые значения баланса и профиля применены');
    }

    function runDirectorPush() {
      const sender = (document.getElementById('dir-sender').value || 'Александр М.').trim();
      const amt = parseFloat(document.getElementById('dir-inc-amt').value) || 10000;
      closeSheet();
      switchTab('home');
      triggerIncomingDemo(amt, sender, 3500);
    }

    function triggerIncomingDemo(amount, sender, delayMs) {
      haptic('light');
      setTimeout(() => {
        state.blackBalance = +(state.blackBalance + amount).toFixed(2);
        state.transactions.unshift({
          id: 'tx_' + Date.now(),
          title: sender,
          subtitle: 'Входящий перевод СБП',
          amount,
          type: 'in',
          cat: 'Переводы',
          cashback: 0,
          time: 'Только что',
          icon: '💸',
          bg: '#DCFCE7'
        });
        saveState();
        renderAll();
        showPush('Пополнение · Black', `+${fmtMoney(amount, true)} от ${sender}`);
      }, delayMs);
    }

    function resetDemoState() {
      localStorage.removeItem(STORAGE_KEY);
      state = getDefaultState();
      renderAll();
      showPush('Демо сброшено', 'Восстановлены начальные счета и история операций');
    }

    // --- Stories Viewer ---
    let storyIdx = 0;
    let storyProgress = 0;
    let storyInterval = null;

    function openStory(idx) {
      haptic('light');
      storyIdx = idx;
      document.getElementById('story-overlay').classList.add('open');
      showCurrentStory();
    }

    function showCurrentStory() {
      const s = STORIES[storyIdx];
      state.storiesViewed[s.id] = true;
      saveState();
      renderHome();

      const overlay = document.getElementById('story-overlay');
      overlay.style.background = s.bg;
      document.getElementById('story-big-emoji').textContent = s.emoji;
      document.getElementById('story-heading').textContent = s.heading;
      document.getElementById('story-desc').textContent = s.desc;
      const cta = document.getElementById('story-cta');
      cta.textContent = s.cta;
      cta.onclick = () => {
        closeStory();
        s.action();
      };

      document.getElementById('story-bars').innerHTML = STORIES.map((_, i) => `
        <div class="story-bar"><div id="sbar-${i}" class="story-bar-fill" style="width:${i < storyIdx ? 100 : 0}%"></div></div>
      `).join('');

      storyProgress = 0;
      clearInterval(storyInterval);
      storyInterval = setInterval(() => {
        storyProgress += 2.5;
        const bar = document.getElementById(`sbar-${storyIdx}`);
        if (bar) bar.style.width = Math.min(100, storyProgress) + '%';
        if (storyProgress >= 100) {
          if (storyIdx < STORIES.length - 1) {
            storyIdx++;
            showCurrentStory();
          } else {
            closeStory();
          }
        }
      }, 110);
    }

    function onStoryTap(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width * 0.35) {
        if (storyIdx > 0) { storyIdx--; showCurrentStory(); }
      } else {
        if (storyIdx < STORIES.length - 1) { storyIdx++; showCurrentStory(); } else { closeStory(); }
      }
    }

    function closeStory() {
      clearInterval(storyInterval);
      document.getElementById('story-overlay').classList.remove('open');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Boot
    renderAll();
  </script>
</body>
</html>
